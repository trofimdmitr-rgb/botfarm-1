# Проверки на каждый push: серверные тесты + автотесты «как в Telegram» (4 устройства × 2 темы).
# Скриншоты всех экранов и отчёт — во вкладке Actions → запуск → Artifacts.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens-and-report
          path: |
            e2e-screens/
            e2e-report/
          retention-days: 14
