<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Онлайн-запись</title>

    <!-- мост MAX грузим только когда мини-апп открыт в MAX (адрес в кабинете MAX: …/?max=1) -->

      if (/[?&]max=1/.test(location.search) || (/WebAppData=/.test(location.hash) && !/tgWebAppData=/.test(location.hash)))
        document.write('<script src="https://st.max.ru/js/max-web-app.js"><\/script>');
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
